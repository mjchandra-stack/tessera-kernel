#
# Unsafe-code inventory: every module containing unsafe code, its owner,
# scope, and why no safe expression exists. Machine-checked at tier 0
# (//tools/checks:unsafe_inventory_test); new unprovenanced unsafe fails
# the build. The list must shrink, never silently grow.
# Normative: docs/lifecycle/04-coding-guidelines.md ("Unsafe Code")

[[entry]]
file = "kernel/kcore/src/sync.rs"
owner = "mjchandra@gmail.com"
scope = "SpinLock internals: UnsafeCell access under the lock, Sync impl, panic-path force_unlock"
justification = "interior mutability behind a lock has no safe expression without an external dependency"

