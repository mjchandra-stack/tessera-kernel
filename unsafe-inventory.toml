scope = "per-CPU slot storage: the Sync impl over the slot array, and the shared and exclusive accessors that reach a slot through its UnsafeCell"
justification = "one CPU mutating its own slot while others read theirs is the access pattern the type exists to express, and the borrow checker cannot see that the index selects disjoint state; the exclusive accessor is unsafe so its obligation is stated at every call site"

