[[entry]]
file = "kernel/karch-aarch64/src/paging.rs"
owner = "mjchandra@gmail.com"
scope = "page-table descriptor reads/writes and frame zero/fill/copy through the direct map, TLB invalidation, the position-independent coarse boot-table fill (raw stores through physical frame addresses), the MMU-enable sequence over both TTBRs (MAIR/TCR/TTBR0/TTBR1/SCTLR), and the live TTBR0/TTBR1 switch to the real split tables"
justification = "page-table memory is reached as raw physical addresses through the direct map, and translation control is privileged CPU state; neither has a safe expression. The boot-table fill and MMU-enable run before translation is on, so they are deliberately position-independent (raw stores, no bounds/overflow checks, no calls), verified by disassembly to emit no absolute relocation"

