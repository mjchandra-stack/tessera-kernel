[[entry]]
file = "kernel/kernel-aarch64/src/main.rs"
owner = "mjchandra@gmail.com"
scope = "the _start/_start_high entry stub (exception-level normalization, position-independent stack/boot-table setup, MMU enable, branch to the high half, .bss zeroing), the aarch64_boot_mmu_up shim that forwards the reserved-frame addresses to the position-independent MMU primitives, the live switch to the split tables, the single &mut to the console static, forming a slice over the firmware's device tree blob (memory map and virtio-mmio discovery), the panic report path, and the EL0 harness (init_user/context-switch into ring 3, the return-context statics, reading the switch-check/perf/EL0 context storage, activating per-process TTBR0 address spaces to run and isolate two EL0 processes, running an EL0 process on the kcore substrate — the static Scheduler/ProcessTable reached through raw pointers, the kcore syscall-bridge hook, and the from_root kernel-space alias — and the unified el0_dispatch_hook building the shared DispatchEnv over the static Executive/ProcessTable and the check-scoped EL0_DISPATCH_FRAMES boot-allocator pointer (valid only while a check runs, null-checked to a distinct fault sink), whose borrows park across a channel handoff and are never dereferenced while parked; the direct-map read-back verifying the dma_alloc VA/phys aliasing, and the device-IRQ bridge signalling the driver-host port from interrupt context — sound because exception entry masks IRQs so it never aliases a live Executive borrow, and the line is enabled only around the scheduler run boot does not otherwise touch); the SMMU boot glue (direct-map word access to the stream table, command and event queues, and stage-2 translation tables — frames the boot allocator handed out, written at their direct-map aliases while the hardware walks them at their physical addresses — the volatile 64-bit BAR accessors for edu's DMA registers, and the check-scoped EL0_DISPATCH_IOMMU pointer through which a covered DmaAlloc installs a translation, null when the machine has no IOMMU and cleared before the check returns); and the power glue (volatile access to the PL031 real-time clock through the high-half Device mapping the check makes for it, and the wakeup-source bridge, which masks the line and counts the wake from interrupt context under the same never-aliases-a-live-borrow argument the device-IRQ bridge rests on)"
justification = "boot entry runs before any Rust invariant holds and must be assembly, and stays position-independent until the branch to the high half turns linked addresses valid; aarch64_boot_mmu_up only forwards arguments to position-independent primitives (no static touched); the console static is one device object created before concurrency exists; the device tree arrives as a bare firmware address and only a slice makes it safely readable, after which the reader itself forbids unsafe"

[[entry]]
file = "kernel/kernel-aarch64/src/virtio.rs"
owner = "mjchandra@gmail.com"
scope = "virtio-blk and virtio-net boot glue: volatile virtio-mmio register access (read32/write32 through the Mmio trait), forming a length-validated slice over the device-tree blob to discover transports, direct-map raw-slice views of the DMA queue and buffer frames for both devices (zero/write/read), the dsb ordering barrier, and the volatile used-ring completion poll"
justification = "device registers, DMA memory reached by physical address through the direct map, and the barriered completion poll are exactly the operations the memory-safe tessera-virtio core cannot express; the transport logic it drives forbids unsafe and is host-tested, so only these hardware-touching primitives carry unsafe, each single-threaded at boot with the driver owning the device"

