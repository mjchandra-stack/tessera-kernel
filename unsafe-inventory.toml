[[entry]]
file = "kernel/kernel-aarch64/src/virtio.rs"
owner = "mjchandra@gmail.com"
scope = "virtio-blk and virtio-net boot glue: volatile virtio-mmio register access (read32/write32 through the Mmio trait), forming a length-validated slice over the device-tree blob to discover transports, direct-map raw-slice views of the DMA queue and buffer frames for both devices (zero/write/read), the dsb ordering barrier, and the volatile used-ring completion poll"
justification = "device registers, DMA memory reached by physical address through the direct map, and the barriered completion poll are exactly the operations the memory-safe tessera-virtio core cannot express; the transport logic it drives forbids unsafe and is host-tested, so only these hardware-touching primitives carry unsafe, each on the boot CPU with the driver owning the device, and the device's interrupt routed to that CPU alone"

