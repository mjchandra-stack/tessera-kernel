file = "kernel/karch-arm32/src/paging.rs"
owner = "mjchandra@gmail.com"
scope = "descriptor reads and writes through the identity window, the frame fill/zero/copy/partial-write primitives, borrowing a live table hierarchy in from_root, TLB and cache maintenance, and the TTBR0/TTBR1 writes that install a translation root"
justification = "editing page tables and reaching physical frames through a direct map are below the reference model; enabling translation is a genuine capability. Every narrowing of a 40-bit physical address to a 32-bit pointer is sound because build_kernel_space rejects a memory map reaching past the window once, where an error can be reported"

[[entry]]
file = "kernel/kernel-arm32/src/main.rs"
owner = "mjchandra@gmail.com"
scope = "_start entry assembly (including the two pre-translation boot roots, the TTBCR/MAIR/TTBR programming, the MMU enable and the jump into the high half, then the banked per-mode stacks), no_mangle linkage on the Rust entry point, the two one-time PL011 static references (the physical console before the kernel's own tables are installed and the windowed one after), linker section symbol declarations, the device-tree slices formed over the firmware handoff address, installing the kernel space and declaring the device window, emptying TTBR0, activating each process address space, the User-mode check harness (the user program blob and its bounding symbols, the static kernel stack and continuation contexts, and the switches into and away from a user thread), and panic-path console access"
justification = "boot glue sequences the one-time privileged bring-up; each site's invariant is stated inline"

[[entry]]
file = "kernel/kernel-arm32/src/boot.rs"
owner = "mjchandra@gmail.com"
scope = "the device-tree slices formed over the firmware handoff address"
justification = "the blob arrives as a raw address from the boot protocol; its length is validated from the header before the larger slice is formed and the reader bounds-checks every access inside it"

[[entry]]
file = "userspace/device-manager/src/main.rs"
owner = "mjchandra@gmail.com"
scope = "volatile reads of the two identifying registers on each MapDevice-granted window, and the volatile re-reads of the request buffer the kernel filled during a recv"
justification = "a user-space service's syscall boundary and capability-granted device window cross the reference model; each site's invariant is the kernel grant that created it — the window exists exactly because MapDevice succeeded on a capability boot handed this program"

[[entry]]
file = "userspace/blk-probe/src/main.rs"
owner = "mjchandra@gmail.com"
scope = "the volatile read of the identifying register on the MapDevice-granted window, the volatile re-reads of the reply buffer the kernel filled during the bind call, and the deliberate null read that makes this driver crash on demand"
justification = "a driver's syscall boundary and capability-granted device window cross the reference model; each site's invariant is the kernel grant that created it — the window exists exactly because MapDevice succeeded on the capability the manager transferred. The null read is the exception that has no invariant and wants none: it exists to fault, so that the crash-recovery ladder is exercised by a real contained CPU fault rather than by a driver exiting tidily"

[[entry]]
file = "userspace/power-manager/src/main.rs"
owner = "mjchandra@gmail.com"
scope = "the volatile re-read of the method ordinal the kernel writes back into the channel descriptor, and the `no_mangle` entry point"
justification = "this program touches no device and holds no window — its only crossing of the reference model is the syscall boundary. The compiler has no way to know an `svc` wrote into a stack buffer it can see this program never wrote to, so the ordinal it would otherwise reuse is the value encoded before the call; volatile is what closes that gap and its invariant is the kernel's own descriptor layout, which the ISL schema fixes"
