#
# Cargo workspace — the developer INNER LOOP only. Release artifacts are
# produced exclusively by the Bazel graph with vendored, pinned dependencies;
# cargo output is never shipped.
# Normative: docs/lifecycle/02-build-and-test-infrastructure.md

[workspace]
resolver = "3"
members = [
    "api/isl",
    "api/isl-runtime",
    "kernel/arch-conformance",
    "kernel/devicetree",
    "kernel/karch",
    "kernel/karch-aarch64",
    "kernel/karch-arm-common",
    "kernel/karch-arm32",
    "kernel/karch-mock",
    "kernel/karch-riscv-common",
    "kernel/karch-riscv32",
    "kernel/karch-riscv64",
    "kernel/karch-x86_64",
    "kernel/kcore",
    "kernel/kernel",
    "kernel/pci",
    "kernel/smmu",
    "kernel/kernel-aarch64",
    "kernel/kernel-arm32",
    "kernel/kernel-riscv32",
    "kernel/kernel-riscv64",
    "kernel/virtio",
    "kernel/width-conformance",
    "tools/checks",
]
# The kernel binaries and their architecture ports need a bare-metal target
# (`cargo kbuild` / `cargo kbuild-aarch64` / `cargo kbuild-riscv64`); plain
# host builds cover the architecture-independent libraries and their tests.
default-members = [
    "api/isl",
    "api/isl-runtime",
    "kernel/arch-conformance",
    "kernel/devicetree",
    "kernel/karch",
    "kernel/karch-mock",
    "kernel/kcore",
    "kernel/pci",
    "kernel/smmu",
    "kernel/virtio",
    "tools/checks",
]
