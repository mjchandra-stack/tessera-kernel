[package]
name = "tessera-kernel-riscv32"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Tessera RISC-V 32 kernel binary: boot glue and composition root"

[[bin]]
name = "tessera-kernel-riscv32"
path = "src/main.rs"

[dependencies]
tessera-arch-conformance = { path = "../arch-conformance" }
tessera-devicetree = { path = "../devicetree" }
tessera-karch = { path = "../karch" }
tessera-karch-riscv32 = { path = "../karch-riscv32" }
tessera-kcore = { path = "../kcore" }
