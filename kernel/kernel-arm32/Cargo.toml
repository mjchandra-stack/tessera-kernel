[package]
name = "tessera-kernel-arm32"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Tessera ARM 32-bit kernel binary: boot glue and composition root"

[[bin]]
name = "tessera-kernel-arm32"
path = "src/main.rs"

[dependencies]
tessera-arch-conformance = { path = "../arch-conformance" }
tessera-devicetree = { path = "../devicetree" }
tessera-karch = { path = "../karch" }
tessera-karch-arm32 = { path = "../karch-arm32" }
tessera-kcore = { path = "../kcore" }
