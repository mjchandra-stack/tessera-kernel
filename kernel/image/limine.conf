#
# Bootloader configuration for the Stage 0 image: boot the kernel
# instantly, with the bootloader's own serial I/O enabled so boot-time
# failures are visible on the same wire as the kernel console.

timeout: 0
serial: yes

/Tessera
    protocol: limine
    path: boot():/boot/tessera-kernel
